<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="margin:0;">

<div class="messenger-container">
  <!-- বামপাশের চ্যাট লিস্ট -->
  <div class="messenger-sidebar">
    <div class="sidebar-header">Chats</div>
    <div id="inboxList" class="chat-list"></div>
  </div>

  <!-- ডানপাশের মূল চ্যাট এরিয়া -->
  <div class="messenger-main">
    <div class="chat-header">
      <div id="chatAvatar" class="avatar" style="width:35px;height:35px;">U</div>
      <span id="chatDesigner">User</span>
    </div>

    <!-- মেসেজ দেখানোর বক্স -->
    <div id="chatMessages" class="chat-messages"></div>

    <!-- মেসেজ ও ফাইল ইনপুট -->
    <div class="chat-footer">
      <label for="demoFile" style="cursor:pointer;font-size:20px;margin:0;" title="Send File">📎</label>
      <input type="file" id="demoFile" accept="image/*,.pdf,.eps,.psd,.ai">
      <input type="text" id="messageInput" placeholder="Aa" onkeypress="if(event.key==='Enter') sendDemoMessage()">
      <button onclick="sendDemoMessage()">➤</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  import { loadChat, sendDemoMessage, sendDemoFile } from './app.js';

  window.sendDemoMessage = sendDemoMessage;
  window.sendDemoFile = sendDemoFile;

  document.addEventListener("DOMContentLoaded", () => {
    if (typeof loadChat === "function") {
      loadChat();
    }
  });
</script>
</body>
</html>
