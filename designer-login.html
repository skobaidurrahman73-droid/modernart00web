<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designer Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container narrow">
  <section class="card">
    <h1>🎨 Designer Login</h1>
    <label>Phone Number</label>
    <input id="designerPhone" type="tel" placeholder="01XXXXXXXXX">
    <label>Password</label>
    <input id="designerPassword" type="password" placeholder="পাসওয়ার্ড দিন">
    <button id="designerLoginBtn" class="btn primary" style="margin-top: 15px;">Login</button>
  </section>
</main>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  document.getElementById("designerLoginBtn").addEventListener("click", () => {
    if (typeof window.designerLogin === "function") {
      window.designerLogin();
    }
  });
</script>
</body>
</html>
