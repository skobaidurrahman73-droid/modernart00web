<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <strong>👑 <span id="shopName">Modern Art & Press</span> Admin</strong>
  <button class="btn small" onclick="logout()">Logout</button>
  <button class="btn danger" onclick="clearOldData()">পুরনো চ্যাট ডিলিট করুন</button>

</header>

<main class="container">
  <section class="stats">
    <div class="stat"><b id="customerCount">0</b><span>Customers</span></div>
    <div class="stat"><b id="designerCount">0</b><span>Designers</span></div>
  </section>

  <section class="card">
    <h3>🎨 নতুন ডিজাইনার যুক্ত করুন</h3>
    <input id="desName" placeholder="ডিজাইনারের নাম">
    <input id="desPhone" placeholder="ফোন নম্বর">
    <input id="desSpec" placeholder="স্পেশালিটি (যেমন: Logo, Banner)">
    <button class="btn primary" onclick="addDesigner()">Add Designer</button>
  </section>

  <section class="card">
    <h2>🎨 Designer List</h2>
    <div id="adminDesigners"></div>
  </section>

  <section class="card">
    <h2>👥 Customer List</h2>
    <div id="adminCustomers"></div>
  </section>
</main>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
      if (typeof window.loadAdminDashboard === "function") {
        window.loadAdminDashboard();
      }
    }, 500);
  });
</script>
</body>
</html>
