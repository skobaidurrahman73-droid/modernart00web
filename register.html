<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration - Modern Art & Press</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><strong id="shopName">Modern Art & Press</strong></header>
<main class="container narrow">
  <section class="card">
    <h1>Customer Registration</h1>
    <label>আপনার নাম</label><input id="name" placeholder="নাম লিখুন">
    <label>ফোন নম্বর</label><input id="phone" type="tel" placeholder="01XXXXXXXXX">
    <label class="check"><input id="vipRequest" type="checkbox"> VIP Account-এর জন্য Request করছি</label>
    <button class="btn primary" onclick="registerCustomer()">Create Account</button>
    <p class="muted">VIP নির্বাচন করলেই সরাসরি VIP হবে না; Admin অনুমোদন করবেন।</p>
  </section>
</main>
<script src="jconfig.js"></script>
<script type="module" src="firebase-config.js"></script><script src="app.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
